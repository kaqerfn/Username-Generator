<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>username generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111113;
      color: #dddde1;
      font-family: Arial, sans-serif;
    }

    .wrap {
      width: 92%;
      max-width: 620px;
      margin: 0 auto;
      padding: 28px 0 40px;
    }

    .top {
      margin-bottom: 18px;
    }

    .title {
      font-size: 13px;
      color: #a9a9ae;
    }

    .pink {
      color: #f064a5;
    }

    .search {
      width: 100%;
      height: 42px;
      padding: 0 12px;

      background: #19191c;
      color: #eee;

      border: 1px solid #29292d;
      border-radius: 6px;
      outline: none;

      font-size: 13px;
    }

    .search:focus {
      border-color: #b64d7c;
    }

    .search::placeholder {
      color: #66666c;
    }

    .generate {
      width: 100%;
      height: 42px;
      margin-top: 7px;

      background: #e65c9c;
      color: white;

      border: 0;
      border-radius: 6px;

      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .generate:hover {
      background: #ed68a5;
    }

    .generate:active {
      transform: translateY(1px);
    }

    .list {
      margin-top: 15px;
    }

    .item {
      min-height: 47px;
      padding: 0 11px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      background: #18181b;
      border: 1px solid #222225;

      margin-bottom: 5px;
      border-radius: 5px;
    }

    .username {
      color: #e4e4e7;
      font-family: monospace;
      font-size: 14px;
    }

    .right {
      display: flex;
      gap: 5px;
    }

    .btn {
      border: 0;
      background: #222226;
      color: #737379;

      border-radius: 4px;
      padding: 6px 8px;

      font-size: 11px;
      cursor: pointer;
    }

    .btn:hover {
      color: #f064a5;
    }

    .saved {
      color: #f064a5;
    }

    .nothing {
      text-align: center;
      padding: 25px;
      color: #55555b;
      font-size: 12px;
    }

    .bottom {
      margin-top: 17px;
      color: #4f4f55;
      font-size: 10px;
    }
  </style>
</head>

<body>

  <div class="wrap">

    <div class="top">
      <div class="title">
        username generator made by
        <span class="pink">@kaqerfn</span>
        on discord
      </div>
    </div>


    <input
      id="search"
      class="search"
      type="text"
      placeholder="search…"
      autocomplete="off"
    >


    <button
      id="generate"
      class="generate"
      type="button"
    >
      generate
    </button>


    <div id="list" class="list"></div>


    <div class="bottom">
      generated names are not guaranteed to be available
    </div>

  </div>


  <script>

    const list = document.getElementById("list");
    const search = document.getElementById("search");
    const generate = document.getElementById("generate");

    let names = [];


    /*
      Small pieces are mixed together instead of
      following one obvious formula.

      The goal is short creator-style handles,
      not dictionary words or keyboard spam.
    */

    const first = [
      "ka", "ke", "ki",
      "za", "ze", "zi",
      "va", "ve", "vi",
      "xa", "xe",
      "qa", "qe",
      "ra", "re",
      "na", "ne",
      "da", "de",
      "la", "le",
      "sa", "se",
      "ta", "te",
      "ma", "me"
    ];

    const small = [
      "k", "q", "x", "z",
      "v", "r", "n", "d",
      "f", "l", "s", "m"
    ];

    const vowels = [
      "a", "e", "i", "o", "u"
    ];

    const endings = [
      "n", "r", "x", "z",
      "q", "v", "k", "y",
      "f", "d"
    ];

    const pieces = [
      "en", "er", "an",
      "in", "yn", "ev",
      "ex", "ar", "av",
      "ix", "or", "ai",
      "el", "ez"
    ];


    function pick(array) {
      return array[
        Math.floor(Math.random() * array.length)
      ];
    }


    function makeName() {

      let name = "";

      const style =
        Math.floor(Math.random() * 10);


      if (style === 0) {
        name =
          pick(small) +
          pick(vowels) +
          pick(endings);
      }

      else if (style === 1) {
        name =
          pick(first) +
          pick(endings);
      }

      else if (style === 2) {
        name =
          pick(first) +
          pick(small) +
          pick(vowels);
      }

      else if (style === 3) {
        name =
          pick(small) +
          pick(vowels) +
          pick(small) +
          pick(endings);
      }

      else if (style === 4) {
        name =
          pick(first) +
          pick(pieces);
      }

      else if (style === 5) {
        name =
          pick(first) +
          pick(small) +
          pick(endings);
      }

      else if (style === 6) {
        name =
          pick(small) +
          pick(vowels) +
          pick(pieces);
      }

      else if (style === 7) {
        name =
          pick(first) +
          pick(small) +
          pick(vowels) +
          pick(endings);
      }

      else if (style === 8) {
        name =
          pick(first) +
          pick(pieces) +
          pick(small);
      }

      else {
        name =
          pick(small) +
          pick(vowels) +
          pick(small) +
          pick(vowels) +
          pick(endings);
      }


      /*
        Keep everything lowercase and remove
        anything outside normal username characters.
      */

      return name
        .toLowerCase()
        .replace(/[^a-z0-9]/g, "");
    }


    function generateNames() {

      const set = new Set();

      while (set.size < 25) {
        set.add(makeName());
      }

      names = Array.from(set);

      showNames();
    }


    function showNames() {

      const query =
        search.value
          .toLowerCase()
          .trim();

      list.innerHTML = "";


      const filtered =
        names.filter(name =>
          name.includes(query)
        );


      if (filtered.length === 0) {

        list.innerHTML =
          '<div class="nothing">nothing found</div>';

        return;
      }


      filtered.forEach(name => {

        const item =
          document.createElement("div");

        item.className = "item";


        const key =
          "favorite_" + name;


        const isSaved =
          localStorage.getItem(key) === "1";


        item.innerHTML = `
          <span class="username">${name}</span>

          <div class="right">

            <button
              class="btn favorite ${isSaved ? "saved" : ""}"
              type="button"
            >
              ${isSaved ? "♥" : "♡"}
            </button>

            <button
              class="btn copy"
              type="button"
            >
              copy
            </button>

          </div>
        `;


        const favorite =
          item.querySelector(".favorite");

        const copy =
          item.querySelector(".copy");


        favorite.onclick = () => {

          const saved =
            localStorage.getItem(key) === "1";


          if (saved) {
            localStorage.removeItem(key);
            favorite.textContent = "♡";
            favorite.classList.remove("saved");
          }

          else {
            localStorage.setItem(key, "1");
            favorite.textContent = "♥";
            favorite.classList.add("saved");
          }
        };


        copy.onclick = async () => {

          try {

            await navigator.clipboard.writeText(name);

          } catch {

            const box =
              document.createElement("textarea");

            box.value = name;

            document.body.appendChild(box);

            box.select();

            document.execCommand("copy");

            box.remove();
          }


          copy.textContent = "copied";


          setTimeout(() => {
            copy.textContent = "copy";
          }, 800);
        };


        list.appendChild(item);
      });
    }


    generate.onclick = generateNames;

    search.oninput = showNames;

    generateNames();

  </script>

</body>
</html>
