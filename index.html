<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Username Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101012;
      color: #ededee;
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: min(680px, 92%);
      margin: auto;
      padding: 32px 0 45px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .title {
      color: #c8c8cc;
      font-size: 14px;
      font-weight: 500;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff6fae;
      box-shadow: 0 0 10px rgba(255, 111, 174, 0.35);
    }

    .search {
      width: 100%;
      height: 45px;
      padding: 0 14px;
      margin-bottom: 9px;

      border: 1px solid #28282c;
      border-radius: 9px;
      outline: none;

      background: #1b1b1e;
      color: #fff;

      font-size: 14px;
    }

    .search::placeholder {
      color: #707076;
    }

    .search:focus {
      border-color: #a94d76;
    }

    .generate {
      width: 100%;
      height: 45px;

      border: 0;
      border-radius: 9px;

      background: #e45b98;
      color: white;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;
      transition: background 0.15s;
    }

    .generate:hover {
      background: #ed68a3;
    }

    .generate:active {
      transform: scale(0.99);
    }

    .results {
      margin-top: 17px;
    }

    .username-row {
      display: flex;
      align-items: center;
      justify-content: space-between;

      min-height: 52px;
      padding: 0 13px;
      margin-bottom: 7px;

      background: #18181b;
      border: 1px solid #242428;
      border-radius: 9px;
    }

    .name {
      font-family: monospace;
      font-size: 15px;
      letter-spacing: 0.2px;
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    .action {
      border: 0;
      border-radius: 6px;
      padding: 7px 9px;

      background: #222226;
      color: #77777e;

      font-size: 12px;
      cursor: pointer;
    }

    .action:hover {
      color: #ff6fae;
    }

    .favorite.active {
      color: #ff6fae;
    }

    .empty {
      padding: 35px 0;
      text-align: center;
      color: #66666c;
      font-size: 13px;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      color: #505057;
      font-size: 11px;
    }

    @media (max-width: 500px) {
      .app {
        width: 94%;
        padding-top: 24px;
      }

      .title {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="header">
      <div class="title">
        username generator made by @kaqerfn on discord
      </div>

      <div class="dot"></div>
    </header>


    <input
      id="search"
      class="search"
      type="text"
      placeholder="search…"
      autocomplete="off"
    >


    <button
      id="generate"
      class="generate"
      type="button"
    >
      generate
    </button>


    <section id="results" class="results"></section>


    <div class="footer">
      unlimited usernames
    </div>

  </main>


  <script>
    const generateButton = document.getElementById("generate");
    const searchInput = document.getElementById("search");
    const results = document.getElementById("results");

    let usernames = [];


    /*
      The examples you gave are NOT used as usernames.

      These are just building blocks that give the
      generator a similar short / uncommon feeling.
    */

    const consonants = "bcdfghjklmnpqrstvwxyz";
    const vowels = "aeiou";

    const goodPairs = [
      "ka", "ke", "ki", "ko",
      "za", "ze", "zi", "zo",
      "qa", "qe", "qi",
      "va", "ve", "vi",
      "xa", "xe", "xi",
      "ra", "re", "ri",
      "da", "de", "di",
      "la", "le", "li",
      "na", "ne", "ni",
      "sa", "se", "si",
      "ta", "te", "ti"
    ];

    const endings = [
      "n", "q", "x", "z",
      "r", "f", "k", "v",
      "d", "l"
    ];


    function randomFrom(text) {
      return text[Math.floor(Math.random() * text.length)];
    }


    function randomPair() {
      return goodPairs[
        Math.floor(Math.random() * goodPairs.length)
      ];
    }


    function makeUsername() {

      /*
        Several different structures are used so the
        names don't all look identical.
      */

      const type = Math.floor(Math.random() * 7);

      let name = "";


      // 3 characters
      if (type === 0) {
        name =
          randomFrom(consonants) +
          randomFrom(vowels) +
          randomFrom(endings);
      }


      // 4 characters
      else if (type === 1) {
        name =
          randomPair() +
          randomFrom(endings) +
          randomFrom(endings);
      }


      // 5 characters
      else if (type === 2) {
        name =
          randomPair() +
          randomFrom(consonants) +
          randomFrom(vowels) +
          randomFrom(endings);
      }


      // 5 characters, different structure
      else if (type === 3) {
        name =
          randomFrom(consonants) +
          randomFrom(vowels) +
          randomFrom(consonants) +
          randomPair();
      }


      // 6 characters
      else if (type === 4) {
        name =
          randomPair() +
          randomFrom(consonants) +
          randomFrom(vowels) +
          randomFrom(endings) +
          randomFrom(endings);
      }


      // 7 characters
      else if (type === 5) {
        name =
          randomPair() +
          randomFrom(consonants) +
          randomFrom(vowels) +
          randomFrom(consonants) +
          randomFrom(vowels) +
          randomFrom(endings);
      }


      // 8 characters
      else {
        name =
          randomPair() +
          randomFrom(consonants) +
          randomFrom(vowels) +
          randomFrom(consonants) +
          randomFrom(vowels) +
          randomFrom(endings) +
          randomFrom(endings);
      }


      return name.toLowerCase();
    }


    function generateUsernames() {

      const newNames = new Set();

      /*
        Keep generating until we have 20 unique names.
      */

      while (newNames.size < 20) {
        newNames.add(makeUsername());
      }

      usernames = Array.from(newNames);

      displayUsernames();
    }


    function displayUsernames() {

      const searchText =
        searchInput.value.toLowerCase().trim();

      results.innerHTML = "";


      const filtered = usernames.filter(username =>
        username.includes(searchText)
      );


      if (filtered.length === 0) {

        results.innerHTML = `
          <div class="empty">
            no usernames found
          </div>
        `;

        return;
      }


      filtered.forEach(username => {

        const row = document.createElement("div");

        row.className = "username-row";


        const favoriteKey =
          "favorite_" + username;

        const isFavorite =
          localStorage.getItem(favoriteKey) === "true";


        row.innerHTML = `
          <span class="name">${username}</span>

          <div class="actions">

            <button
              type="button"
              class="action favorite ${
                isFavorite ? "active" : ""
              }"
            >
              ${isFavorite ? "♥" : "♡"}
            </button>

            <button
              type="button"
              class="action copy"
            >
              copy
            </button>

          </div>
        `;


        const favorite =
          row.querySelector(".favorite");

        const copy =
          row.querySelector(".copy");


        favorite.addEventListener("click", () => {

          const currentlySaved =
            localStorage.getItem(favoriteKey) === "true";


          localStorage.setItem(
            favoriteKey,
            String(!currentlySaved)
          );


          favorite.textContent =
            currentlySaved ? "♡" : "♥";


          favorite.classList.toggle(
            "active",
            !currentlySaved
          );

        });


        copy.addEventListener("click", async () => {

          try {

            await navigator.clipboard.writeText(username);

            copy.textContent = "copied";

            setTimeout(() => {
              copy.textContent = "copy";
            }, 900);

          } catch {

            /*
              Fallback for browsers where clipboard
              permissions are unavailable.
            */

            const textArea =
              document.createElement("textarea");

            textArea.value = username;

            document.body.appendChild(textArea);

            textArea.select();

            document.execCommand("copy");

            textArea.remove();

            copy.textContent = "copied";

            setTimeout(() => {
              copy.textContent = "copy";
            }, 900);
          }

        });


        results.appendChild(row);

      });

    }


    /*
      Generate button
    */

    generateButton.addEventListener(
      "click",
      generateUsernames
    );


    /*
      Search updates instantly
    */

    searchInput.addEventListener(
      "input",
      displayUsernames
    );


    /*
      Generate the first set when the page opens.
    */

    generateUsernames();

  </script>

</body>
</html>
