<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Username Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111113;
      color: #eeeeef;
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: min(650px, 92%);
      margin: 0 auto;
      padding: 35px 0 50px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .title {
      font-size: 15px;
      color: #c9c9cc;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #ff6fae;
      border-radius: 50%;
    }

    .search {
      width: 100%;
      height: 46px;
      border: none;
      outline: none;
      border-radius: 10px;
      background: #1d1d20;
      color: #fff;
      padding: 0 14px;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .search::placeholder {
      color: #77777d;
    }

    .generate {
      width: 100%;
      height: 45px;
      border: none;
      border-radius: 10px;
      background: #e85b9b;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .generate:hover {
      background: #f06aa7;
    }

    .results {
      margin-top: 18px;
    }

    .username-row {
      display: flex;
      align-items: center;
      justify-content: space-between;

      min-height: 52px;
      padding: 0 14px;
      margin-bottom: 7px;

      background: #19191c;
      border: 1px solid #232326;
      border-radius: 10px;
    }

    .name {
      font-family: monospace;
      font-size: 15px;
      color: #e7e7e9;
    }

    .buttons {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .small-button {
      border: none;
      background: #232326;
      color: #85858c;
      border-radius: 7px;
      padding: 7px 9px;
      cursor: pointer;
      font-size: 12px;
    }

    .small-button:hover {
      color: #ff6fae;
    }

    .favorite.active {
      color: #ff6fae;
    }

    .empty {
      text-align: center;
      padding: 35px 0;
      color: #66666d;
      font-size: 13px;
    }

    .footer {
      margin-top: 25px;
      text-align: center;
      color: #55555b;
      font-size: 11px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <div class="title">
        username generator made by @kaqerfn on discord
      </div>

      <div class="dot"></div>
    </div>

    <input
      id="search"
      class="search"
      type="text"
      placeholder="search…"
      autocomplete="off"
    >

    <button id="generate" class="generate">
      generate
    </button>

    <div id="results" class="results"></div>

    <div class="footer">
      unlimited usernames
    </div>

  </div>

  <script>
    const results = document.getElementById("results");
    const generateButton = document.getElementById("generate");
    const search = document.getElementById("search");

    const vowels = "aeiou";
    const consonants = "bcdfghjklmnpqrstvwxyz";

    let usernames = [];

    function randomLetter(chars) {
      return chars[Math.floor(Math.random() * chars.length)];
    }

    function createUsername() {
      const patterns = [
        "cvcv",
        "cvccv",
        "cvcvc",
        "ccvcv",
        "cvccvc",
        "cvcvcv",
        "ccvcvc"
      ];

      const pattern =
        patterns[Math.floor(Math.random() * patterns.length)];

      let username = "";

      for (let i = 0; i < pattern.length; i++) {
        if (pattern[i] === "c") {
          username += randomLetter(consonants);
        } else {
          username += randomLetter(vowels);
        }
      }

      return username;
    }

    function generateUsernames() {
      usernames = [];

      while (usernames.length < 15) {
        const name = createUsername();

        if (!usernames.includes(name)) {
          usernames.push(name);
        }
      }

      displayUsernames();
    }

    function displayUsernames() {
      const searchText = search.value.toLowerCase();

      results.innerHTML = "";

      const filtered = usernames.filter(name =>
        name.toLowerCase().includes(searchText)
      );

      if (filtered.length === 0) {
        results.innerHTML = `
          <div class="empty">
            no usernames found
          </div>
        `;
        return;
      }

      filtered.forEach(name => {
        const row = document.createElement("div");
        row.className = "username-row";

        const saved =
          localStorage.getItem("favorite-" + name) === "true";

        row.innerHTML = `
          <span class="name">${name}</span>

          <div class="buttons">
            <button class="small-button favorite ${saved ? "active" : ""}">
              ${saved ? "♥" : "♡"}
            </button>

            <button class="small-button copy">
              copy
            </button>
          </div>
        `;

        const favorite = row.querySelector(".favorite");
        const copy = row.querySelector(".copy");

        favorite.addEventListener("click", () => {
          const isFavorite =
            localStorage.getItem("favorite-" + name) === "true";

          localStorage.setItem(
            "favorite-" + name,
            String(!isFavorite)
          );

          favorite.textContent = !isFavorite ? "♥" : "♡";
          favorite.classList.toggle("active", !isFavorite);
        });

        copy.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(name);

            copy.textContent = "copied";

            setTimeout(() => {
              copy.textContent = "copy";
            }, 900);

          } catch {
            copy.textContent = "error";
          }
        });

        results.appendChild(row);
      });
    }

    generateButton.addEventListener("click", generateUsernames);

    search.addEventListener("input", displayUsernames);

    generateUsernames();
  </script>

</body>
</html>
