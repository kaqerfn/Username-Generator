<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Username Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0f0f11;
      color: #ededee;
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: min(680px, 94%);
      margin: auto;
      padding: 30px 0 45px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .title {
      color: #d0d0d3;
      font-size: 14px;
      font-weight: 500;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff5fa2;
      box-shadow: 0 0 12px rgba(255, 95, 162, .4);
    }

    .search {
      width: 100%;
      height: 46px;
      padding: 0 14px;

      background: #1b1b1f;
      border: 1px solid #29292d;
      border-radius: 9px;
      outline: none;

      color: white;
      font-size: 14px;
    }

    .search::placeholder {
      color: #707077;
    }

    .search:focus {
      border-color: #b94d7c;
    }

    .generate {
      width: 100%;
      height: 46px;
      margin-top: 9px;

      border: 0;
      border-radius: 9px;

      background: #e85b9b;
      color: white;

      font-size: 14px;
      font-weight: 600;

      cursor: pointer;
    }

    .generate:hover {
      background: #f067a6;
    }

    .generate:active {
      transform: scale(.99);
    }

    .results {
      margin-top: 17px;
    }

    .username-row {
      display: flex;
      align-items: center;
      justify-content: space-between;

      min-height: 53px;
      padding: 0 13px;
      margin-bottom: 7px;

      background: #18181b;
      border: 1px solid #242428;
      border-radius: 9px;
    }

    .name {
      color: #eeeeef;
      font-family: monospace;
      font-size: 15px;
      letter-spacing: .2px;
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    .action {
      padding: 7px 9px;

      border: 0;
      border-radius: 6px;

      background: #232327;
      color: #77777f;

      font-size: 12px;
      cursor: pointer;
    }

    .action:hover {
      color: #ff5fa2;
    }

    .favorite.active {
      color: #ff5fa2;
    }

    .empty {
      padding: 35px 0;
      text-align: center;
      color: #66666d;
      font-size: 13px;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      color: #505057;
      font-size: 11px;
    }

    @media (max-width: 500px) {
      .app {
        padding-top: 23px;
      }

      .title {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="header">
      <div class="title">
        username generator made by @kaqerfn on discord
      </div>

      <div class="dot"></div>
    </header>


    <input
      id="search"
      class="search"
      type="text"
      placeholder="search…"
      autocomplete="off"
    >


    <button
      id="generate"
      class="generate"
      type="button"
    >
      generate
    </button>


    <section id="results" class="results"></section>


    <div class="footer">
      generated creator handles
    </div>

  </main>


  <script>

    const generateButton =
      document.getElementById("generate");

    const searchInput =
      document.getElementById("search");

    const results =
      document.getElementById("results");


    let usernames = [];


    /*
      These are building blocks rather than a list
      of finished usernames.

      The generator combines them differently so
      the results don't repeatedly give you the
      same names.
    */

    const beginnings = [
      "za", "ze", "zi",
      "ka", "ke", "ki",
      "va", "ve", "vi",
      "xa", "xe", "xi",
      "qa", "qe",
      "ra", "re",
      "na", "ne",
      "da", "de",
      "la", "le",
      "sa", "se",
      "ta", "te",
      "ma", "me"
    ];


    const shortBeginnings = [
      "z", "k", "v", "x",
      "q", "r", "n", "d",
      "l", "s"
    ];


    const middles = [
      "y", "v", "x", "z",
      "r", "n", "l", "m",
      "d", "k", "q"
    ];


    const endings = [
      "a", "e", "i", "o",
      "n", "r", "x", "z",
      "y", "q", "v"
    ];


    const extras = [
      "en", "er", "an",
      "in", "ix", "yn",
      "ev", "ex", "ar",
      "ai", "eo", "av",
      "ez", "or"
    ];


    function pick(array) {
      return array[
        Math.floor(Math.random() * array.length)
      ];
    }


    function makeUsername() {

      const type =
        Math.floor(Math.random() * 9);

      let name;


      /*
        4 letters
        Example shape: zven
      */

      if (type === 0) {

        name =
          pick(shortBeginnings) +
          pick(endings) +
          pick(middles) +
          pick(endings);

      }


      /*
        5 letters
        Example shape: vexin
      */

      else if (type === 1) {

        name =
          pick(beginnings) +
          pick(middles) +
          pick(endings);

      }


      /*
        5 letters
        Example shape: zayen
      */

      else if (type === 2) {

        name =
          pick(shortBeginnings) +
          pick(endings) +
          pick(middles) +
          pick(extras);

      }


      /*
        6 letters
        Example shape: kaiven
      */

      else if (type === 3) {

        name =
          pick(beginnings) +
          pick(middles) +
          pick(endings) +
          pick(middles);

      }


      /*
        6 letters
      */

      else if (type === 4) {

        name =
          pick(beginnings) +
          pick(extras) +
          pick(endings);

      }


      /*
        7 letters
      */

      else if (type === 5) {

        name =
          pick(beginnings) +
          pick(middles) +
          pick(extras) +
          pick(endings);

      }


      /*
        7 letters
      */

      else if (type === 6) {

        name =
          pick(shortBeginnings) +
          pick(endings) +
          pick(middles) +
          pick(extras) +
          pick(endings);

      }


      /*
        8 letters
      */

      else if (type === 7) {

        name =
          pick(beginnings) +
          pick(middles) +
          pick(extras) +
          pick(middles) +
          pick(endings);

      }


      /*
        Short creator-style handle
      */

      else {

        name =
          pick(shortBeginnings) +
          pick(endings) +
          pick(middles) +
          pick(endings) +
          pick(middles);

      }


      return name.toLowerCase();
    }


    function generateUsernames() {

      const generated = new Set();


      while (generated.size < 20) {

        const username = makeUsername();

        /*
          Don't allow the same name twice in
          the current batch.
        */

        generated.add(username);
      }


      usernames =
        Array.from(generated);


      displayUsernames();
    }


    function displayUsernames() {

      const search =
        searchInput.value
          .toLowerCase()
          .trim();


      results.innerHTML = "";


      const filtered =
        usernames.filter(username =>
          username.includes(search)
        );


      if (filtered.length === 0) {

        results.innerHTML = `
          <div class="empty">
            no usernames found
          </div>
        `;

        return;
      }


      filtered.forEach(username => {

        const row =
          document.createElement("div");

        row.className =
          "username-row";


        const favoriteKey =
          "favorite_" + username;


        const saved =
          localStorage.getItem(favoriteKey)
          === "true";


        row.innerHTML = `
          <span class="name">
            ${username}
          </span>

          <div class="actions">

            <button
              type="button"
              class="action favorite ${saved ? "active" : ""}"
            >
              ${saved ? "♥" : "♡"}
            </button>

            <button
              type="button"
              class="action copy"
            >
              copy
            </button>

          </div>
        `;


        const favorite =
          row.querySelector(".favorite");


        const copy =
          row.querySelector(".copy");


        favorite.addEventListener(
          "click",
          () => {

            const currentlySaved =
              localStorage.getItem(favoriteKey)
              === "true";


            localStorage.setItem(
              favoriteKey,
              String(!currentlySaved)
            );


            favorite.textContent =
              currentlySaved ? "♡" : "♥";


            favorite.classList.toggle(
              "active",
              !currentlySaved
            );

          }
        );


        copy.addEventListener(
          "click",
          async () => {

            try {

              await navigator.clipboard
                .writeText(username);

            } catch {

              const textarea =
                document.createElement("textarea");

              textarea.value = username;

              document.body.appendChild(textarea);

              textarea.select();

              document.execCommand("copy");

              textarea.remove();
            }


            copy.textContent =
              "copied";


            setTimeout(() => {

              copy.textContent =
                "copy";

            }, 900);

          }
        );


        results.appendChild(row);

      });

    }


    /*
      Generate a new batch whenever the button
      is pressed.
    */

    generateButton.onclick =
      generateUsernames;


    /*
      Search filters the current results.
    */

    searchInput.oninput =
      displayUsernames;


    /*
      Generate the first batch immediately.
    */

    generateUsernames();

  </script>

</body>
</html>
