<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Username Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111113;
      color: #f2f2f3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      min-height: 100vh;
      padding: 25px;
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 35px;
    }

    .title {
      font-size: 21px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .status {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff6fae;
      box-shadow: 0 0 12px rgba(255, 111, 174, 0.5);
    }

    .search {
      width: 100%;
      height: 52px;
      border: 0;
      outline: none;
      border-radius: 14px;
      padding: 0 17px;
      background: #202023;
      color: white;
      font-size: 15px;
      margin-bottom: 14px;
    }

    .search::placeholder {
      color: #77777d;
    }

    .generate {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 14px;
      background: #e85b9b;
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .generate:active {
      transform: scale(0.99);
    }

    .results {
      margin-top: 25px;
    }

    .result {
      display: flex;
      align-items: center;
      justify-content: space-between;

      background: #1b1b1e;
      border-radius: 14px;

      padding: 16px 17px;
      margin-bottom: 9px;

      font-family: monospace;
      font-size: 16px;
    }

    .username {
      color: #eeeeef;
    }

    .copy {
      border: 0;
      background: transparent;
      color: #77777d;
      cursor: pointer;
      font-size: 13px;
    }

    .copy:hover {
      color: #e85b9b;
    }

    .bottom {
      margin-top: 35px;
      color: #5f5f65;
      font-size: 12px;
      text-align: center;
    }

    @media (min-width: 700px) {
      .page {
        width: 600px;
        margin: auto;
        padding-top: 45px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="top">
      <div class="title">
        username generator made by @kaqerfn on discord
      </div>

      <div class="status"></div>
    </div>

    <input
      class="search"
      type="text"
      placeholder="search…"
    >

    <button class="generate">
      generate
    </button>

    <div class="results">

      <div class="result">
        <span class="username">kaqerfn</span>
        <button class="copy">copy</button>
      </div>

      <div class="result">
        <span class="username">zenunq</span>
        <button class="copy">copy</button>
      </div>

      <div class="result">
        <span class="username">kera</span>
        <button class="copy">copy</button>
      </div>

      <div class="result">
        <span class="username">zkl</span>
        <button class="copy">copy</button>
      </div>

      <div class="result">
        <span class="username">itzdexau</span>
        <button class="copy">copy</button>
      </div>

    </div>

    <div class="bottom">
      simple username generator
    </div>

  </main>

</body>
</html>
