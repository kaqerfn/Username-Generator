<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Username Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101012;
      color: #e9e9eb;
      font-family: Arial, Helvetica, sans-serif;
    }

    .app {
      width: min(680px, 92%);
      margin: auto;
      padding: 32px 0 45px;
    }

    /* header */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .title {
      color: #c7c7ca;
      font-size: 14px;
      font-weight: 500;
    }

    .online {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff6fae;
    }

    /* search */

    .search {
      width: 100%;
      height: 45px;
      border: 1px solid #27272b;
      outline: none;
      border-radius: 9px;
      background: #1b1b1e;
      color: #fff;
      padding: 0 14px;
      font-size: 14px;
      margin-bottom: 9px;
    }

    .search:focus {
      border-color: #a94770;
    }

    .search::placeholder {
      color: #6f6f75;
    }

    /* buttons */

    .generate {
      width: 100%;
      height: 45px;
      border: 0;
      border-radius: 9px;
      background: #e45b98;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .generate:hover {
      background: #ee66a3;
    }

    .generate:active {
      transform: scale(.99);
    }

    /* results */

    .results {
      margin-top: 17px;
    }

    .username {
      display: flex;
      align-items: center;
      justify-content: space-between;

      min-height: 52px;
      padding: 0 13px;

      margin-bottom: 7px;

      background: #18181b;
      border: 1px solid #242428;
      border-radius: 9px;
    }

    .name {
      font-family: monospace;
      font-size: 15px;
      letter-spacing: .2px;
    }

    .actions {
      display: flex;
      gap: 6px;
    }

    .action {
      border: 0;
      border-radius: 6px;
      background: #222226;
      color: #77777e;
      padding: 7px 9px;
      font-size: 12px;
      cursor: pointer;
    }

    .action:hover {
      color: #ff6fae;
    }

    .favorite.active {
      color: #ff6fae;
    }

    .empty {
      padding: 35px 0;
      text-align: center;
      color: #66666c;
      font-size: 13px;
    }

    .footer {
      margin-top: 24px;
      text-align: center;
      color: #505057;
      font-size: 11px;
    }

    @media (max-width: 500px) {
      .app {
        padding-top: 24px;
      }

      .title {
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="header">
      <div class="title">
        username generator made by @kaqerfn on discord
      </div>

      <div class="online"></div>
    </header>

    <input
      id="search"
      class="search"
      type="text"
      placeholder="search…"
      autocomplete="off"
    >

    <button id="generate" class="generate">
      generate
    </button>

    <section id="results" class="results"></section>

    <div class="footer">
      unlimited usernames
    </div>

  </main>


  <script>

    const results = document.getElementById("results");
    const generateButton = document.getElementById("generate");
    const search = document.getElementById("search");

    let usernames = [];


    /*
      These are the kinds of letter combinations
      the generator likes.

      It avoids obvious words and avoids making
      every username follow exactly the same pattern.
    */

    const starts = [
      "ka", "ke", "ki", "ko",
      "za", "ze", "zi", "zo",
      "qa", "qe", "qi",
      "va", "ve", "vi",
      "xa", "xe",
      "it", "ix",
      "ne", "no",
      "ra", "re",
      "de", "da",
      "la", "le",
      "se", "si"
    ];

    const middle = [
      "q", "k", "x", "z",
      "v", "n", "r", "d",
      "f", "t", "l", "m"
    ];

    const endings = [
      "n", "q", "x", "z",
      "r", "f", "k", "v",
      "a", "e", "u"
    ];


    function randomItem(array) {
      return array[Math.floor(Math.random() * array.length)];
    }


    function createUsername() {

      const type = Math.floor(Math.random() * 5);

      let name;


      /* very short */

      if (type === 0) {

        name =
          randomItem([
            "k", "z", "q", "x", "v", "n"
          ]) +
          randomItem([
            "a", "e", "i", "o", "u"
          ]) +
          randomItem(endings);

      }


      /* 4 letters */

      else if (type === 1) {

        name =
          randomItem(starts).slice(0, 2) +
          randomItem(endings) +
          randomItem(endings);

      }


      /* 5 letters */

      else if (type === 2) {

        name =
          randomItem(starts) +
          randomItem(middle) +
          randomItem(endings);

      }


      /* 6 letters */

      else if (type === 3) {

        name =
          randomItem(starts) +
          randomItem(middle) +
          randomItem(endings) +
          randomItem(endings);

      }


      /* 7–8 letters */

      else {

        name =
          randomItem(starts) +
          randomItem(middle) +
          randomItem(endings) +
          randomItem(middle) +
          randomItem(endings);

      }


      return name.toLowerCase();
    }


    function generateUsernames() {

      usernames = [];

      while (usernames.length < 20) {

        const name = createUsername();

        if (!usernames.includes(name)) {
          usernames.push(name);
        }
      }

      displayUsernames();
    }


    function displayUsernames() {

      const query = search.value.toLowerCase().trim();

      results.innerHTML = "";


      const filtered = usernames.filter(name =>
        name.includes(query)
      );


      if (filtered.length === 0) {

        results.innerHTML = `
          <div class="empty">
            no usernames found
          </div>
        `;

        return;
      }


      filtered.forEach(name => {

        const row = document.createElement("div");
        row.className = "username";


        const favoriteSaved =
          localStorage.getItem("favorite_" + name) === "true";


        row.innerHTML = `
          <span class="name">${name}</span>

          <div class="actions">

            <button class="action favorite ${
              favoriteSaved ? "active" : ""
            }">
              ${favoriteSaved ? "♥" : "♡"}
            </button>

            <button class="action copy">
              copy
            </button>

          </div>
        `;


        const favorite =
          row.querySelector(".favorite");

        const copy =
          row.querySelector(".copy");


        favorite.addEventListener("click", () => {

          const saved =
            localStorage.getItem("favorite_" + name) === "true";


          localStorage.setItem(
            "favorite_" + name,
            String(!saved)
          );


          favorite.textContent =
            !saved ? "♥" : "♡";

          favorite.classList.toggle(
            "active",
            !saved
          );

        });


        copy.addEventListener("click", async () => {

          try {

            await navigator.clipboard.writeText(name);

            copy.textContent = "copied";

            setTimeout(() => {
              copy.textContent = "copy";
            }, 900);

          } catch {

            copy.textContent = "failed";

            setTimeout(() => {
              copy.textContent = "copy";
            }, 900);

          }

        });


        results.appendChild(row);

      });

    }


    generateButton.addEventListener(
      "click",
      generateUsernames
    );


    search.addEventListener(
      "input",
      displayUsernames
    );


    generateUsernames();

  </script>

</body>
</html>
